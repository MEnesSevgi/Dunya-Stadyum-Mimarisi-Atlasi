  <!DOCTYPE html>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --pitch-green: #27ae60; 
            --concrete-grey: #ecf0f1;
            --floodlight: #f1c40f;
            --stadium-dark: #2c3e50;
        }
        
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; background: var(--concrete-grey); overflow: hidden; }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100%; }
        @media (min-width: 768px) { .app-container { flex-direction: row; } }

        #map { flex: 1; width: 100%; z-index: 1; background: #b2bec3; }

        #info-panel { 
            background: white; display: flex; flex-direction: column; z-index: 1000; 
            box-shadow: -5px 0 25px rgba(0,0,0,0.1);
        }

        @media (min-width: 768px) {
            #info-panel { width: 420px; height: 100%; border-left: 3px solid var(--stadium-dark); }
        }

        @media (max-width: 767px) { #info-panel { height: 50vh; } }

        .header { background: var(--stadium-dark); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--pitch-green); }
        .header h1 { margin: 0; font-size: 14px; letter-spacing: 1.5px;  font-weight: 800; }
        
        .search-area { padding: 15px; background: #fdfdfd; }
        select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; color: var(--stadium-dark); }
        
        #content-area { padding: 25px; overflow-y: auto; flex: 1; }
        #stadium-title { margin: 0; color: var(--stadium-dark); font-size: 24px; font-weight: 900; }
        
        .arch-badge { 
            margin: 12px 0; display: inline-flex; align-items: center; 
            background: #e8f5e9; color: #2e7d32; padding: 6px 14px; 
            border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase;
        }

        .details-box { font-size: 15px; color: #555; line-height: 1.7; margin-top: 15px; border-left: 3px solid var(--floodlight); padding-left: 15px; }

        #stadium-img { 
            width: 100%; border-radius: 12px; margin-top: 20px; 
            display: none; object-fit: cover; max-height: 200px;
        }

        .btn { 
            display: block; margin-top: 25px; padding: 15px; 
            background: var(--stadium-dark); color: white; 
            text-decoration: none; text-align: center; border-radius: 8px; font-weight: bold; transition: 0.3s;
        }

        .btn:hover { background: var(--pitch-green); }

        .custom-marker {
            width: 18px !important; height: 18px !important;
            background: var(--stadium-dark); border: 3px solid var(--pitch-green); border-radius: 50% 50% 0 50%;
            transform: rotate(45deg); box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .translation-info { font-size: 11px; color: #888; font-style: italic; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

<div class="app-container">

</div>

    const map = L.map('map', { zoomControl: true }).setView([20, 10], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png').addTo(map);

    const select = document.getElementById('stadiumSelect');
    
    dataSet.forEach(item => {
        const m = L.marker([item.lat, item.lng], { 
            icon: L.divIcon({ className: 'custom-marker' }) 
        }).addTo(map);
        
        const opt = document.createElement('option');
        opt.value = item.name; 
        opt.textContent = `${item.cat} | ${item.name}`;
        select.appendChild(opt);
        
        m.on('click', () => {
            updatePanel(item);
            map.flyTo([item.lat, item.lng], 13);
        });
    });

    select.onchange = (e) => {
        const item = dataSet.find(d => d.name === e.target.value);
        if (item) { updatePanel(item); map.flyTo([item.lat, item.lng], 13); }
    };

    async function translateText(text) {
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=tr&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            return data[0].map(item => item[0]).join('');
        } catch (error) {
            return text;
        }
    }

    function updatePanel(item) {
        const titleEl = document.getElementById('stadium-title');
        const styleBox = document.getElementById('style-box');
        const styleName = document.getElementById('style-name');
        const textEl = document.getElementById('stadium-text');
        const imgEl = document.getElementById('stadium-img');
        const linkEl = document.getElementById('wiki-link');

        titleEl.textContent = item.name;
        styleBox.style.display = 'inline-flex';
        styleName.textContent = item.cat;
        textEl.innerHTML = `<strong>Mimari Analiz:</strong> ${item.desc}<br><br><span id="summary">Bilgiler yükleniyor...</span>`;
        
        imgEl.style.display = 'none';
        imgEl.src = '';

        fetch(`https://tr.wikipedia.org/api/rest_v1/page/summary/${item.wiki}`)
            .then(res => {
                if (!res.ok) throw new Error();
                return res.json();
            })
            .then(data => displayWikiData(data, false))
            .catch(() => {
                fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${item.wiki}`)
                    .then(res => res.json())
                    .then(async (data) => {
                        if (data.extract) {
                            const translated = await translateText(data.extract);
                            data.extract = translated;
                            displayWikiData(data, true);
                        } else {
                            document.getElementById('summary').textContent = "Bilgi bulunamadı.";
                        }
                    })
                    .catch(() => {
                        document.getElementById('summary').textContent = "Bilgi kaynağına ulaşılamadı.";
                    });
            });

        function displayWikiData(data, isTranslated) {
            const summaryEl = document.getElementById('summary');
            const infoTag = isTranslated ? '<span class="translation-info">İngilizce üzerinden otomatik çevrildi</span>' : '';
            
            summaryEl.innerHTML = infoTag + (data.extract || "Özet bulunamadı.");

            if (data.thumbnail) {
                imgEl.src = data.thumbnail.source;
                imgEl.style.display = 'block';
            }
            
            if (data.content_urls) {
                linkEl.href = data.content_urls.desktop.page;
                linkEl.style.display = 'block';
                linkEl.textContent = isTranslated ? "İNGİLİZCE KAYNAĞI GÖR" : "MİMARİ DETAYLARI İNCELE";
            }
        }
    }
</script>
